[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openresearch-control"
version = "0.1.0"
description = "Commit-addressed control plane for local-edit and remote-evaluate AutoResearch loops"
requires-python = ">=3.11"

[project.scripts]
openresearch = "openresearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
